<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hearth</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff4e6;
        color: #1f2a55;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      img { width: 160px; height: 160px; object-fit: contain; }
      h1 { font-size: 36px; font-weight: 800; margin: 12px 0 8px; }
      p { font-size: 15px; color: #4d5b8c; max-width: 300px; line-height: 1.5; }
      button {
        margin-top: 24px;
        background: #f08a3a;
        color: #fff8f0;
        border: 3px solid #1f2a55;
        border-radius: 999px;
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 800;
        box-shadow: 0 6px 0 #1f2a55;
      }
      button:active { transform: translateY(6px); box-shadow: none; }
    </style>
  </head>
  <body>
    <img src="https://hearth-gc8u.onrender.com/ember.png" alt="Ember" />
    <h1>Hearth</h1>
    <p>The ritual needs a connection. Check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
