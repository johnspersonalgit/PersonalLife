<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hearth</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fbf8f3;
        color: #22201c;
        font-family: Georgia, serif;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 28px; font-weight: 500; margin: 0 0 8px; }
      p { font-family: system-ui, sans-serif; font-size: 14px; color: #6f675b; max-width: 300px; line-height: 1.5; }
      button {
        margin-top: 24px;
        background: #c69a6a;
        color: #fffdf9;
        border: 0;
        border-radius: 16px;
        padding: 14px 28px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: 0 4px 0 #b98f56;
      }
      button:active { transform: translateY(4px); box-shadow: none; }
    </style>
  </head>
  <body>
    <h1>Hearth</h1>
    <p>The ritual needs a connection. Check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
